<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book details | Online Library</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book-details">

  <header class="site-header">
    <a class="site-header__brand" href="index.html">Online Library</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="catalog.html" aria-current="page">Catalog</a>
      <a href="my-library.html" data-auth="user" hidden>My Library</a>
      <a href="admin.html" data-auth="admin" hidden>Admin</a>
      <a href="login.html" id="auth-btn" class="btn">Log in</a>
    </nav>
  </header>

  <main class="page page--book-details">

    <p><a href="catalog.html">&larr; Back to catalog</a></p>
    <article class="book-details" data-book-id="">
      <div class="book-details__cover" aria-hidden="true" data-field="cover"></div>
      <div class="book-details__info">
        <h1 data-field="title">Book title</h1>
        <p class="muted"><span data-field="author">Author</span> &middot; <span data-field="genre">Genre</span> &middot; <span data-field="year">Year</span> &middot; <span data-field="type">Format</span></p>
        <p data-field="description">Short description.</p>
        <p class="status" data-field="availability">Available (2 of 2 copies)</p>

          <h3>Chapters</h3>
          <ol id="chapter-list" class="chapter-list"></ol>
        </section>
        <div class="actions">
          <a id="btn-read" class="btn" href="reader.html">Read online</a>
          <button id="btn-list" type="button" class="btn btn--ghost">Add to reading list</button>
          <button id="btn-borrow" type="button" class="btn btn--ghost">Borrow</button>
          <button id="btn-return" type="button" class="btn btn--ghost" hidden>Return book</button>
          <button id="btn-wait" type="button" class="btn btn--ghost" hidden>Join the waitlist</button>
          <button id="btn-unwait" type="button" class="btn btn--ghost" hidden>Leave waitlist</button>
        </div>
      </div>
    </article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="site-footer">
    <p>Online Library &middot; Group 1 &middot; ICCT Colleges Foundation Inc. &middot; School project</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/book-details.js"></script>
</body>
</html>
