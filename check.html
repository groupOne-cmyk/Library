<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File check | Online Library</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body data-page="check">
  <main class="page">
    <h1>File check</h1>
    <p class="muted">This page opens every file of the site fresh from the server and tells you whether it is the newest version. If something looks wrong on the site, send a screenshot of this page.</p>
    <p id="check-summary" class="status">Checking...</p>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">File</th><th scope="col">Result</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
    <p><a href="index.html">Back to the site</a></p>
  </main>
  <script src="js/check.js?v=8"></script>
</body>
</html>
